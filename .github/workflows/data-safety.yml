name: RepLap data safety
on:
  pull_request:
  push:
    branches: [main, "feature/**"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Model typecheck
        run: npm run typecheck:model
      - name: Unit tests
        run: npm test
      - name: App typecheck
        run: npm run typecheck
      - name: Firestore emulator rules
        run: npm run test:rules
      - name: Production build
        run: npm run build
