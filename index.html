<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101629" />
  <meta name="description" content="A private, local-first push–pull–legs and swimming workout tracker." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>Rep & Lap — Your training tracker</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><div class="brand-mark"><span></span><span></span><span></span></div><div><strong>rep<span>&</span>lap</strong><small>TRAINING HQ</small></div></div>
      <div class="nav-group-label">WORKSPACE</div>
      <nav class="side-nav" id="sideNav" aria-label="Views"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-coach">
        <div class="coach-icon" aria-hidden="true">✦</div>
        <strong>Consistency wins.</strong>
        <p>Three lifts. Three swims. One stronger you.</p>
        <div class="coach-stripes"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <a class="sidebar-sheet" href="https://docs.google.com/spreadsheets/d/1wXWgc62YyYDiqV9XPjyDYlgbsHwoxJQeUpl6htIvSew/edit?usp=drivesdk" target="_blank" rel="noopener noreferrer">Original Google Sheet <span>↗</span></a>
      <div class="sidebar-footer">LOCAL-FIRST · PRIVATE BY DEFAULT</div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="breadcrumb"><span class="breadcrumb-dot"></span><span id="breadcrumbName">Overview</span><span class="breadcrumb-muted">/ Training space</span></div>
        <div class="top-actions"><span class="saved-state" id="saveState"><span class="save-indicator"></span> Saved on this device</span><button id="headerToday" class="today-btn" type="button">This week</button></div>
      </header>
      <main id="app" class="content" tabindex="-1"></main>
      <footer class="footer">Progress over perfection. <span>Rep & Lap · v1</span></footer>
    </div>
    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden />
  <script src="app.js" defer></script>
</body>
</html>
