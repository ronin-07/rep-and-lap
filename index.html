<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101629" />
  <meta name="description" content="Track push–pull–legs, swimming, weight and water with optional Google sign-in and cloud sync." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <title>Rep & Lap V2.1 — Training + Hydration</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand"><div class="brand-mark"><span></span><span></span><span></span></div><div><strong>rep<span>&</span>lap</strong><small>TRAINING HQ</small></div></div>
      <div class="nav-group-label">WORKSPACE</div>
      <nav class="side-nav" id="sideNav" aria-label="Views"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-coach">
        <div class="coach-icon" aria-hidden="true">✦</div>
        <strong>Consistency wins.</strong>
        <p>Three lifts. Three swims. One stronger you.</p>
        <div class="coach-stripes"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <a class="sidebar-sheet" href="https://docs.google.com/spreadsheets/d/1wXWgc62YyYDiqV9XPjyDYlgbsHwoxJQeUpl6htIvSew/edit?usp=drivesdk" target="_blank" rel="noopener noreferrer">Original Google Sheet <span>↗</span></a>
      <div class="sidebar-footer">LOCAL-FIRST · OPTIONAL CLOUD SYNC</div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <div class="breadcrumb"><span class="breadcrumb-dot"></span><span id="breadcrumbName">Overview</span><span class="breadcrumb-muted">/ Training space</span></div>
        <div class="top-actions"><button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button><button class="theme-toggle settings-shortcut" id="headerSettings" type="button" aria-label="Settings" title="Settings">⚙</button><span class="saved-state" id="saveState"><span class="save-indicator"></span> Saved on this device</span><button id="headerToday" class="today-btn" type="button">This week</button></div>
      </header>
      <main id="app" class="content" tabindex="-1"></main>
      <footer class="footer">Progress over perfection. <span>Rep & Lap · v2.1</span></footer>
    </div>
    <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>
  </div>
  <div id="restDock" class="rest-dock" role="timer" aria-label="Gym rest countdown" hidden>
    <div class="rest-dock-heading"><span class="rest-dock-icon">⏱</span><div><strong>Rest timer</strong><small>Next set when you're ready</small></div></div>
    <div class="rest-clock" id="restCountdown" aria-live="off">01:30</div>
    <div class="rest-dock-buttons"><button type="button" data-action="extend-rest">+15s</button><button type="button" data-action="stop-rest">End</button></div>
    <div class="rest-progress"><span id="restProgress"></span></div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden />
  <script src="supabase-config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
